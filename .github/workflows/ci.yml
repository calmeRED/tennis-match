name: CSV Data Processing

on:
  push:
    branches:
      - main
    paths:
      - 'data/matches.csv'
      - 'scripts/csv_processor.py'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  process:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Process CSV data
        run: python scripts/csv_processor.py data/matches.csv data/players.csv

      - name: Commit and push changes
        run: |
          if [ -f data/players.csv ]; then
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "GitHub Actions Bot"
            git add data/players.csv
            git status
            git commit -m "自动更新 players.csv" || echo "Nothing to commit"
            git push || echo "Push failed, but continuing"
          else
            echo "players.csv not found, skipping commit"
          fi